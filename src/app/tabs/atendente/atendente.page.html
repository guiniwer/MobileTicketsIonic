<ion-header>
  <ion-toolbar>
    <ion-title>Atendimento</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-button expand="block" (click)="chamarSenha()" class="chamar-senha">
    Chamar próxima senha
  </ion-button>

  <ion-card *ngIf="senhaAtual">
    <ion-card-header>
      <ion-card-title>
        {{ senhaAtual.numero }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <p>
        Tipo: <span [style.color]="corTipo(senhaAtual.tipo)" style="font-weight: 700">{{ senhaAtual.tipo }}</span>
      </p>
      <p>Guichê: {{ senhaAtual.guiche }}</p>
    </ion-card-content>
  </ion-card>

  <p *ngIf="!senhaAtual && jaChamou" class="ion-text-center ion-padding">
    Nenhuma senha na fila.
  </p>

</ion-content>
