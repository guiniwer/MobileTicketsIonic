<ion-header>
  <ion-toolbar>
    <ion-title>painel</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h2 class="ultimas-senhas">Últimas Senhas Chamadas</h2>

  <div class="botoes-senha">
    <button (click)="chamarProximaSenha()">
      Chamar próxima senha
    </button>
  </div>


  <ion-list>
    <ion-item *ngFor="let senha of senhasChamadas">
      <ion-label>
        <h3>{{ senha.numero }}</h3>
        <p>Tipo: {{ senha.tipo }}</p>
        <p id="guiche">Guichê: {{ senha.guiche }}</p>
      </ion-label>
    </ion-item>
  </ion-list>


</ion-content>
